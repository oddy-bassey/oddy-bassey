<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="611" viewBox="0 0 1200 611" role="img" aria-label="What I am building: a revenue management platform for Nigerian state governments, an AI-assisted learning platform for schools and universities, and a jetpack action game for phones from curblAI Games"><rect x="1" y="1" width="1198" height="193" rx="12" fill="#161b22" stroke="#30363d"/><g transform="translate(26,60) scale(1.125)"><rect width="64" height="64" rx="16" fill="#ffffff"/><g transform="translate(8,8) scale(0.75)"><path d="M10 55 L32 9 L54 55" fill="none" stroke="#0B2A5B" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><polygon points="23,56 32,38 41,56" fill="#22B3A1"/></g></g><text x="122" y="47" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">A revenue management platform for Nigerian state governments</text><text x="122" y="77" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#c9d1d9">Multi-tenant tax and revenue administration under the 2025 tax reform, with one taxpayer identity across every tax,</text><text x="122" y="102" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#c9d1d9">maker-checker approval on every workflow, a single ledger that changes only through approved allocation, dated statutory</text><text x="122" y="127" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#c9d1d9">rates, an immutable audit trail and five Nigerian languages.</text><text x="122" y="160" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#8d96a0">Cloud or on-premises in a state office, from the same images</text><rect x="1" y="210" width="1198" height="193" rx="12" fill="#161b22" stroke="#30363d"/><g transform="translate(26,270) scale(1.125)"><rect width="64" height="64" rx="16" fill="#0B7A5F"/><rect x="20" y="28" width="13" height="26" rx="6.5" fill="#ffffff"/><circle cx="43" cy="17" r="8" fill="#F0A24A"/></g><text x="122" y="256" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">An AI-assisted learning platform for schools and universities</text><text x="122" y="286" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#c9d1d9">Graphs, 3D solids and a working model of the human body that students manipulate, from anatomy built from real CT scans to</text><text x="122" y="311" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#c9d1d9">a heart and lungs driven by a physiology engine. A lecturer&#x27;s own notes become the lesson through a multi-stage AI</text><text x="122" y="336" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#c9d1d9">pipeline, and a maths engine, not the AI, decides what is correct.</text><text x="122" y="369" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#8d96a0">Classroom boards, PCs and tablets</text><rect x="1" y="419" width="1198" height="193" rx="12" fill="#161b22" stroke="#30363d"/><g transform="translate(26,478) scale(1.125)"><rect width="64" height="64" rx="16" fill="#1f1220"/><path d="M14 10 L50 10 L49 32 Q44 46 32 52 Q20 46 15 32 Z" fill="#F6C21C" stroke="#14100C" stroke-width="3.5" stroke-linejoin="round"/><polygon points="32,15 35,23 43,23 37,28 39,36 32,31 25,36 27,28 21,23 29,23" fill="#14100C"/><rect x="18" y="38" width="28" height="4" fill="#14100C"/></g><text x="122" y="465" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">A jetpack action game for phones, from curblAI Games</text><text x="122" y="495" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#c9d1d9">Cartoon fighters battle across seven maps on a road north through Nigeria, from the Lagos rooftops and the Makoko</text><text x="122" y="520" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#c9d1d9">waterfront to the Cross River rainforest, the Jos tin mines and the Sahel dunes. Each map has its own hiding spots,</text><text x="122" y="545" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#c9d1d9">secrets, creatures and hazards.</text><text x="122" y="578" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#8d96a0">Phones</text></svg>